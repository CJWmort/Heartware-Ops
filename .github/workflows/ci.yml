# FIX: this whole file was commented out, so nothing was ever checked automatically on a pull request.
# Switched back on. If the "client" job fails on lint, run `pnpm run lint` in client/ locally (it auto-fixes most things).
# The "server" job runs the unit tests in server/tests (no database needed: they use stand-ins).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # ⭐ installs pnpm on GitHub's computer
        with:
          version: 10 # ⭐
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install # ⭐ was npm install
      - run: pnpm run lint:check # ⭐
      - run: pnpm run test:unit --run # ⭐
      - run: pnpm run build # ⭐

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # ⭐
        with:
          version: 10 # ⭐
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install # ⭐
      - run: pnpm test # ⭐
