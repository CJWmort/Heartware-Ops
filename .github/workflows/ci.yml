# Runs automatically on every Pull Request and every push to main.
# A red ❌ on your PR means lint, build or unit tests failed – click "Details" to see why.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install   # change to `npm ci` once package-lock.json is committed
      - run: npm run lint:check
      - run: npm run test:unit -- --run
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install   # change to `npm ci` once package-lock.json is committed
      - run: npm test
